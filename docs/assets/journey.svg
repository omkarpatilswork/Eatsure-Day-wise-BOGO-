<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>The six steps of the BOGO journey: Home, BOGO Zone, Add and pair, Cart, Checkout, Celebration</title>
  <rect width="1280" height="300" rx="24" fill="#f6f1fb"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#5B2B91"/>
    </marker>
  </defs>

  <g fill="none" stroke="#5B2B91" stroke-width="3" marker-end="url(#arrow)">
    <path d="M216 150 H236"/>
    <path d="M422 150 H442"/>
    <path d="M628 150 H648"/>
    <path d="M834 150 H854"/>
    <path d="M1040 150 H1060"/>
  </g>

  <!-- step cards: x = 30 + i * 206, width 184 -->
  <g>
    <rect x="30" y="40" width="184" height="220" rx="20" fill="#ffffff" stroke="#e4d8f2"/>
    <circle cx="66" cy="80" r="20" fill="#5B2B91"/>
    <text x="66" y="87" text-anchor="middle" fill="#FFD200" font-size="19" font-weight="800">1</text>
    <text x="48" y="134" fill="#1d0d33" font-size="21" font-weight="800">Home</text>
    <text fill="#6b5a80" font-size="15"><tspan x="48" y="164">Hero banner, BOGO</tspan><tspan x="48" y="186">tab in the nav, Crazy</tspan><tspan x="48" y="208">Deals, a theme for</tspan><tspan x="48" y="230">every day</tspan></text>
  </g>
  <g>
    <rect x="236" y="40" width="184" height="220" rx="20" fill="#ffffff" stroke="#e4d8f2"/>
    <circle cx="272" cy="80" r="20" fill="#5B2B91"/>
    <text x="272" y="87" text-anchor="middle" fill="#FFD200" font-size="19" font-weight="800">2</text>
    <text x="254" y="134" fill="#1d0d33" font-size="21" font-weight="800">BOGO Zone</text>
    <text fill="#6b5a80" font-size="15"><tspan x="254" y="164">Cuisine chips, filters,</tspan><tspan x="254" y="186">sort, and each brand's</tspan><tspan x="254" y="208">paid + free pair</tspan></text>
  </g>
  <g>
    <rect x="442" y="40" width="184" height="220" rx="20" fill="#5B2B91"/>
    <circle cx="478" cy="80" r="20" fill="#FFD200"/>
    <text x="478" y="87" text-anchor="middle" fill="#2b1146" font-size="19" font-weight="800">3</text>
    <text x="460" y="134" fill="#ffffff" font-size="21" font-weight="800">Add &amp; pair</text>
    <text fill="#ffffff" fill-opacity="0.85" font-size="15"><tspan x="460" y="164">Toast, then a purple</tspan><tspan x="460" y="186">prompt to pick the</tspan><tspan x="460" y="208">free dish, added at ₹0</tspan></text>
  </g>
  <g>
    <rect x="648" y="40" width="184" height="220" rx="20" fill="#ffffff" stroke="#e4d8f2"/>
    <circle cx="684" cy="80" r="20" fill="#5B2B91"/>
    <text x="684" y="87" text-anchor="middle" fill="#FFD200" font-size="19" font-weight="800">4</text>
    <text x="666" y="134" fill="#1d0d33" font-size="21" font-weight="800">Cart</text>
    <text fill="#6b5a80" font-size="15"><tspan x="666" y="164">Pairs side by side,</tspan><tspan x="666" y="186">"You saved" banner,</tspan><tspan x="666" y="208">₹79 add-on, real bill</tspan></text>
  </g>
  <g>
    <rect x="854" y="40" width="184" height="220" rx="20" fill="#ffffff" stroke="#e4d8f2"/>
    <circle cx="890" cy="80" r="20" fill="#5B2B91"/>
    <text x="890" y="87" text-anchor="middle" fill="#FFD200" font-size="19" font-weight="800">5</text>
    <text x="872" y="134" fill="#1d0d33" font-size="21" font-weight="800">Checkout</text>
    <text fill="#6b5a80" font-size="15"><tspan x="872" y="164">"BOGO savings</tspan><tspan x="872" y="186">applied", address,</tspan><tspan x="872" y="208">payment method</tspan></text>
  </g>
  <g>
    <rect x="1060" y="40" width="190" height="220" rx="20" fill="#FFD200"/>
    <circle cx="1096" cy="80" r="20" fill="#5B2B91"/>
    <text x="1096" y="87" text-anchor="middle" fill="#FFD200" font-size="19" font-weight="800">6</text>
    <text x="1078" y="134" fill="#2b1146" font-size="21" font-weight="800">Celebration</text>
    <text fill="#2b1146" fill-opacity="0.8" font-size="15"><tspan x="1078" y="164">Confetti, the saving</tspan><tspan x="1078" y="186">in big type, and a</tspan><tspan x="1078" y="208">nudge to more deals</tspan></text>
  </g>
</svg>
